[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "opsbrief"
dynamic = ["version"]
description = "OpsBrief CLI for weekly operational reporting"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpsBrief contributors" }
]
keywords = ["gcp", "gke", "observability", "operations", "reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Monitoring",
  "Typing :: Typed"
]
dependencies = [
  "PyYAML>=6.0.1,<7.0.0",
  "google-api-python-client>=2.170.0,<3.0.0",
  "google-auth-httplib2>=0.2.0,<1.0.0",
  "google-auth>=2.40.0,<3.0.0",
  "google-cloud-compute>=1.25.0,<2.0.0",
  "google-cloud-container>=2.57.0,<3.0.0",
  "google-cloud-dns>=0.35.1,<1.0.0",
  "google-cloud-gke-backup>=0.5.19,<1.0.0",
  "google-cloud-logging>=3.12.0,<4.0.0",
  "google-cloud-managedkafka>=0.2.0,<1.0.0",
  "google-cloud-monitoring>=2.27.0,<3.0.0",
  "google-cloud-pubsub>=2.23.0,<3.0.0",
  "google-cloud-redis>=2.19.0,<3.0.0",
  "httplib2>=0.22.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "Jinja2>=3.1.0,<4.0.0",
  "kubernetes>=30.1.0,<31.0.0",
  "Markdown>=3.7,<4.0.0",
  "matplotlib>=3.8,<4.0.0",
  "numpy>=1.26,<2.3",
  "pydantic>=2.8.0,<3.0.0",
  "weasyprint>=68.0,<69.0"
]

[project.scripts]
opsbrief = "opsbrief.cli:main"

[tool.hatch.version]
path = "src/opsbrief/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/opsbrief"]

[tool.hatch.envs.default]
dependencies = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-PyYAML>=6.0.12.20250516"
]

[tool.hatch.envs.default.scripts]
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
test = "pytest"
typecheck = "mypy src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["google.cloud.dns", "googleapiclient.*", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google_auth_httplib2", "httplib2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud.pubsub_v1"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown", "weasyprint.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "opsbrief.gcp_auth",
  "opsbrief.collectors.kubernetes_health",
  "opsbrief.collectors.mesh"
]
disable_error_code = ["no-untyped-call"]
